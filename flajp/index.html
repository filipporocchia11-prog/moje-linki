<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about.me</title>
    <!-- Zmiana klasy tutaj definiuje wygląd: 'theme-neon' lub 'theme-bw' -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-bw"> 

    <!-- Ekran ładowania 0-100% -->
    <div id="loader">
        <div class="loader-content">
            <div id="progress">0%</div>
            <div class="loading-text">INITIALIZING...</div>
        </div>
    </div>

    <!-- Ciągła animacja tła -->
    <div class="background-anim"></div>

    <!-- Główny kontener (Ramka) -->
    <div class="container hidden" id="main-content">
        <div class="profile-card">
            
            <!-- Licznik wyświetleń -->
            <div class="view-counter">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <span>1,337</span>
            </div>

            <!-- Avatar i nazwa -->
            <div class="profile-info">
                <div class="avatar"></div>
                <h1 class="username">@papiez</h1>
                <p class="bio">Welcome to my zone</p>
            </div>

            <!-- Miejsce na linki -->
            <div class="links-container">
                <a href="#" class="link-btn">Link 1 (Wkrótce)</a>
                <a href="#" class="link-btn">Link 2 (Wkrótce)</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
                  </html>
