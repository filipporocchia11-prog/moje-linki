<html lang="pl">
<head>

    <style>
        /* --- ZMIENNE DLA MOTYWÓW --- */
        .theme-bw {
            --bg-color: #0a0a0a;
            --accent-color: #ffffff;
            --glow: 0 0 20px rgba(255, 255, 255, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.05);
            --card-bg: rgba(20, 20, 20, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- EKRAN ŁADOWANIA --- */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out;
        }

        .loader-content {
            text-align: center;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color);
        }

        #progress {
            font-size: 3rem;
            font-weight: bold;
        }

        .loading-text {
            letter-spacing: 2px;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        /* --- ANIMOWANE TŁO --- */
        .background-anim {
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, transparent 20%, var(--bg-color) 80%),
                        repeating-linear-gradient(transparent 0, transparent 2px, rgba(255, 255, 255, 0.02) 2px, rgba(255, 255, 255, 0.02) 4px);
            animation: pulseBg 10s infinite alternate linear;
            z-index: -1;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.05); opacity: 0.8; }
        }

        /* --- RAMKA (KARTA) --- */
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            opacity: 1;
            transition: opacity 1s ease-in, transform 1s ease-out;
        }

        .container.hidden {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            box-shadow: var(--glow);
            border-radius: 15px;
            padding: 30px;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .view-counter {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .profile-info {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #000;
            border: 2px solid var(--accent-color);

                    <svg class="link-icon" viewBox="0 0 24 24"><path fill="currentColor" d="...[SVG Tiktok]..."/></svg>
                    Tiktok
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Licznik publiczny API dla Flajpa
            fetch('https://api.counterapi.dev/v1/flajp-links/flajp-counter/up')
                .then(response => response.json())
                .then(data => {
                    document.getElementById("view-count").innerText = data.count;
                })
                .catch(err => {
                    document.getElementById("view-count").innerText = "ERR";
                });

            let progressValue = 0;
            const progressText = document.getElementById("progress");
            const loader = document.getElementById("loader");
            const mainContent = document.getElementById("main-content");

            const interval = setInterval(() => {
                progressValue += Math.floor(Math.random() * 15) + 5; 
                if (progressValue >= 100) {
                    progressValue = 100;
                    clearInterval(interval);
                    progressText.innerText = progressValue + "%";
                    setTimeout(() => {
                        loader.style.opacity = "0";
                        setTimeout(() => {
                            loader.style.display = "none";
                            mainContent.classList.remove("hidden");
                        }, 800);
                    }, 500);
                } else {
                    progressText.innerText = progressValue + "%";
                }
            }, 100);
        });
    </script>
</body>
